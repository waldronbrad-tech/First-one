<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weekly Compass</title>
  <meta name="description" content="A weekly planner built on Stephen Covey's Habit 3: Put First Things First. Roles, goals, plans, tasks and actions, color-coded and synced to Google Calendar.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M16 5 L19.5 16 L16 27 L12.5 16 Z" fill="currentColor" opacity=".25"/>
        <path d="M16 5 L19.5 16 L12.5 16 Z" fill="currentColor"/>
      </svg>
      <div>
        <h1>Weekly Compass</h1>
        <p class="tagline">Put first things first</p>
      </div>
    </div>
    <div class="week-nav" aria-label="Week navigation">
      <button class="btn icon" data-act="week-prev" aria-label="Previous week">&#8249;</button>
      <span id="week-label" class="week-label"></span>
      <button class="btn icon" data-act="week-next" aria-label="Next week">&#8250;</button>
      <button class="btn ghost" data-act="week-today">Today</button>
      <button id="sync-status" class="btn small sync-status" data-act="sync-click"></button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" data-view="compass">Compass</button>
    <button role="tab" data-view="plan">Goals &amp; Plans</button>
    <button role="tab" data-view="week">Week</button>
    <button role="tab" data-view="month">Month</button>
    <button role="tab" data-view="review">Review</button>
    <button role="tab" data-view="settings">Settings</button>
  </nav>

  <main id="view" class="view"></main>

  <dialog id="modal" class="modal">
    <form id="modal-form" method="dialog"></form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/gcal.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
